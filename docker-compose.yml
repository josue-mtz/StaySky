services:
  mongo:
    image: mongo:7
    container_name: staysky_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: staysky

  backend:
    build: ./backend
    container_name: staysky_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - ./backend/app:/app/app
      - ./frontend:/app/frontend

volumes:
  mongo_data: