services:
  # BASE DE DATOS (tus datos)
  mongo:
    image: mongo:7
    container_name: staysky_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: staysky

  # BACKEND (FastAPI)
  backend:
    build: ./backend
    container_name: staysky_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - ./backend/app:/app/app
      - ./frontend:/app/frontend

  # POSTGRES (solo metadata de Airflow, NO tus datos)
  postgres:
    image: postgres:15
    container_name: staysky_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # AIRFLOW (init + webserver + scheduler)
  airflow-init:
    build: ./airflow
    container_name: staysky_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho="
      AIRFLOW__WEBSERVER__SECRET_KEY: "staysky_local_secret_change_me"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      STAYSKY_BACKEND_URL: http://backend:8000
      STAYSKY_CONFIRM_REFRESH: "false"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname StaySky \
          --role Admin \
          --email admin@staysky.local \
          || echo "User admin ya existe, continuando...") &&
        echo "airflow-init completado"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

  airflow-webserver:
    build: ./airflow
    container_name: staysky_airflow_web
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment: *airflow-env
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build: ./airflow
    container_name: staysky_airflow_sched
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

volumes:
  mongo_data:
  postgres_data: